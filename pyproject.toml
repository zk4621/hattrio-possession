[project]
name = "possession"
version = "0.1.0"
description = "Per-frame ball possession for More than a Hack 2027, Phase 1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "lightgbm>=4.5,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/possession"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
